name: 构建无签名 IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: 显示工具链
        shell: bash
        run: |
          set -eo pipefail
          xcodebuild -version
          swift --version

      - name: 列出 schemes
        shell: bash
        run: xcodebuild -list

      - name: 编译 Release（无签名）
        shell: bash
        run: |
          set -eo pipefail
          # SwiftPM 包在 xcodebuild 里注册的 scheme 名不一定等于可执行文件名，这里自动取第一个
          scheme="$(xcodebuild -list -json 2>/dev/null | python3 -c 'import json,sys;print(list(json.load(sys.stdin).values())[0]["schemes"][0])' 2>/dev/null)"
          if [ -z "$scheme" ]; then
            echo "::warning::没能自动识别 scheme，回退用 PicGen"
            scheme="PicGen"
          fi
          echo "使用 scheme：$scheme"
          xcodebuild build \
            -scheme "$scheme" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 组装无签名 IPA
        shell: bash
        run: |
          set -eo pipefail
          products="build/Build/Products/Release-iphoneos"
          ls -la "$products" || true

          # 产物名可能跟包名/产物名不一致，两个候选都试一下
          binary=""
          for candidate in "$products/PicGenApp" "$products/PicGen"; do
            if [ -f "$candidate" ]; then
              binary="$candidate"
              break
            fi
          done
          if [ -z "$binary" ]; then
            echo "::error::没找到可执行文件（看上面的 products 目录）"
            exit 1
          fi
          echo "可执行文件：$binary"

          staging="$PWD/artifacts/unsigned"
          rm -rf "$staging"
          app="$staging/Payload/PicGen.app"
          mkdir -p "$app"
          cp "$binary" "$app/PicGenApp"
          cp Info.plist "$app/Info.plist"
          chmod +x "$app/PicGenApp"

          # 图标交给 actool 编译；失败也不影响出包，只是图标可能是空白
          if [ -d Assets.xcassets ]; then
            if xcrun actool Assets.xcassets \
                 --compile "$app" \
                 --platform iphoneos \
                 --minimum-deployment-target 16.0 \
                 --app-icon AppIcon \
                 --output-partial-info-plist "$staging/icon.plist" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Merge $staging/icon.plist" "$app/Info.plist" || true
              /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" "$app/Info.plist" 2>/dev/null \
                || /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" "$app/Info.plist" || true
            else
              echo "::warning::actool 编译图标失败，继续打包"
            fi
            rm -f "$staging/icon.plist"
          fi

          # 版本号：打 tag 时用 tag 名；构建号一律用 workflow 运行号
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$app/Info.plist" || true
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$app/Info.plist" || true

          # 自检
          plutil -lint "$app/Info.plist"
          bundle_id="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist")"
          executable="$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Info.plist")"
          echo "Bundle ID：$bundle_id"
          echo "可执行文件：$executable"
          test -f "$app/$executable"
          xcrun lipo -info "$app/$executable"

          (
            cd "$staging"
            zip -qry PicGen.ipa Payload
            shasum -a 256 PicGen.ipa > PicGen.ipa.sha256
          )
          ls -lh "$staging/PicGen.ipa"

      - name: 上传 IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PicGen-unsigned-ipa
          path: |
            artifacts/unsigned/PicGen.ipa
            artifacts/unsigned/PicGen.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: 发布 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/unsigned/PicGen.ipa
            artifacts/unsigned/PicGen.ipa.sha256
          generate_release_notes: true
